<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Repère" />
<title>Repère</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  -webkit-transition: background 1.2s ease, color 1.2s ease;
  transition: background 1.2s ease, color 1.2s ease;
}

/* ── THEMES ── */
body.t-morning   { background: #fdf6e3; color: #2e1e06; }
body.t-afternoon { background: #eef3f8; color: #0e2040; }
body.t-evening   { background: #e8956a; color: #000000; }
body.t-night     { background: #141820; color: #ffffff; }

#app { max-width: 700px; margin: 0 auto; padding: 20px 28px 140px; }

/* ── CLOCK ── */
#clock-section { text-align: center; padding: 8px 0 10px; margin-bottom: 6px; }
#time {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 120px; font-weight: 900; line-height: 1; letter-spacing: -4px;
}
#day-display { text-align: center; margin-top: 8px; }
#day { font-family: 'Playfair Display', Georgia, serif; font-size: 38px; font-weight: 700; }
.t-morning #day   { color: #c4700a; }
.t-afternoon #day { color: #1a5fa8; }
.t-evening #day   { color: #1a0000; }
.t-night #day     { color: #7aaae0; }
#date { font-size: 19px; font-weight: 500; margin-top: 4px; }
.t-morning #date   { color: #8a6020; }
.t-afternoon #date { color: #3a5a8a; }
.t-evening #date   { color: #2a0800; }
.t-night #date     { color: #8090a8; }

/* ── CONSULTING PILL ── */
#consulting-pill {
  display: none;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
  gap: 6px; border-radius: 20px; padding: 4px 12px; margin-top: 6px;
}
#consulting-pill.show { display: -webkit-inline-box; display: -webkit-inline-flex; display: inline-flex; }
.t-morning #consulting-pill   { background: rgba(196,112,10,0.12); }
.t-afternoon #consulting-pill { background: rgba(26,95,168,0.12); }
.t-evening #consulting-pill   { background: rgba(0,0,0,0.1); }
.t-night #consulting-pill     { background: rgba(122,170,224,0.1); }
#cp-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
#cp-day   { font-size: 13px; font-weight: 700; }
.t-morning #cp-label,  .t-morning #cp-day   { color: #c4700a; }
.t-afternoon #cp-label,.t-afternoon #cp-day { color: #1a5fa8; }
.t-evening #cp-label,  .t-evening #cp-day   { color: #1a0800; }
.t-night #cp-label,    .t-night #cp-day     { color: #7aaae0; }

/* ── AUJOURD'HUI BUTTON ── */
#today-anchor {
  width: 100%; border-radius: 14px; border: 3px solid;
  margin-top: 12px; padding: 14px; font-size: 22px; font-weight: 700;
  cursor: pointer; font-family: 'Inter', sans-serif; text-align: center;
  -webkit-transition: all 0.25s; transition: all 0.25s;
}
.t-morning #today-anchor.is-today   { background: #c4700a; color: #fdf6e3; border-color: #c4700a; }
.t-afternoon #today-anchor.is-today { background: #1a5fa8; color: #eef3f8; border-color: #1a5fa8; }
.t-evening #today-anchor.is-today   { background: #1a0800; color: #e8956a; border-color: #1a0800; }
.t-night #today-anchor.is-today     { background: #7aaae0; color: #141820; border-color: #7aaae0; }
.t-morning #today-anchor.off-today   { background: rgba(196,112,10,0.1);  color: #c4700a; border-color: #c4700a; }
.t-afternoon #today-anchor.off-today { background: rgba(26,95,168,0.1);   color: #1a5fa8; border-color: #1a5fa8; }
.t-evening #today-anchor.off-today   { background: rgba(0,0,0,0.08);      color: #000;    border-color: rgba(0,0,0,0.4); }
.t-night #today-anchor.off-today     { background: rgba(122,170,224,0.1); color: #7aaae0; border-color: #7aaae0; }

/* ── WEEK STRIP ── */
#week-strip {
  display: -webkit-box; display: -webkit-flex; display: flex;
  gap: 6px; margin-top: 12px; overflow-x: auto;
  -webkit-overflow-scrolling: touch; padding-bottom: 4px;
  -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
}
#week-strip::-webkit-scrollbar { display: none; }
.week-day {
  -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
  min-width: 44px; max-width: 80px;
  border-radius: 12px; border: 2px solid;
  padding: 8px 4px; text-align: center; cursor: pointer;
  font-family: 'Inter', sans-serif; background: transparent;
  -webkit-transition: opacity 0.15s; transition: opacity 0.15s;
}
.week-day:active { opacity: 0.7; }
.week-day .wd-name { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; opacity: 0.6; }
.week-day .wd-num  { font-size: 20px; font-weight: 700; margin-top: 3px; font-family: 'Playfair Display', Georgia, serif; }
.t-morning .week-day   { border-color: #e8d090; color: #2e1e06; }
.t-afternoon .week-day { border-color: #b8d0e8; color: #0e2040; }
.t-evening .week-day   { border-color: rgba(0,0,0,0.18); color: #000; }
.t-night .week-day     { border-color: #2e3a50; color: #fff; }
.week-day.is-real-today .wd-name { opacity: 1; }
.t-morning .week-day.is-real-today   { background: #c4700a; border-color: #c4700a; color: #fdf6e3; }
.t-afternoon .week-day.is-real-today { background: #1a5fa8; border-color: #1a5fa8; color: #fff; }
.t-evening .week-day.is-real-today   { background: #1a0800; border-color: #1a0800; color: #e8956a; }
.t-night .week-day.is-real-today     { background: #7aaae0; border-color: #7aaae0; color: #141820; }
.week-day.is-selected:not(.is-real-today) { border-width: 3px; }
.t-morning .week-day.is-selected:not(.is-real-today)   { border-color: #c4700a; color: #c4700a; }
.t-afternoon .week-day.is-selected:not(.is-real-today) { border-color: #1a5fa8; color: #1a5fa8; }
.t-evening .week-day.is-selected:not(.is-real-today)   { border-color: rgba(0,0,0,0.5); color: #000; }
.t-night .week-day.is-selected:not(.is-real-today)     { border-color: #7aaae0; color: #7aaae0; }

/* ── QUICK NAV ── */
#quick-nav {
  display: -webkit-box; display: -webkit-flex; display: flex;
  gap: 10px; margin-top: 8px;
}
.nav-day-btn {
  -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
  border-radius: 12px; border: 2px solid; background: transparent;
  font-size: 16px; font-weight: 700; cursor: pointer; color: inherit;
  padding: 11px 8px; text-align: center; font-family: 'Inter', sans-serif;
}
.t-morning .nav-day-btn   { border-color: #c4700a; color: #c4700a; }
.t-afternoon .nav-day-btn { border-color: #1a5fa8; color: #1a5fa8; }
.t-evening .nav-day-btn   { border-color: rgba(0,0,0,0.3); color: #000; }
.t-night .nav-day-btn     { border-color: #2e3a50; color: #fff; }

/* ── DIVIDER ── */
.divider { height: 1px; margin: 18px 0 20px; }
.t-morning .divider   { background: #dfc98a; }
.t-afternoon .divider { background: #a8c4de; }
.t-evening .divider   { background: rgba(0,0,0,0.18); }
.t-night .divider     { background: #2e3a50; }

/* ── BANNER ── */
#ecm-banner {
  border-radius: 16px; padding: 16px 20px; margin-bottom: 22px;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  gap: 14px;
}
#ecm-banner.b-active { border: none; }
.t-morning #ecm-banner.b-active   { background: #2e1e06; }
.t-afternoon #ecm-banner.b-active { background: #0e2040; }
.t-evening #ecm-banner.b-active   { background: #1a0800; }
.t-night #ecm-banner.b-active     { background: #ffffff; }
.t-morning #ecm-banner.b-active .b-label,
.t-morning #ecm-banner.b-active .b-text,
.t-morning #ecm-banner.b-active .b-sub   { color: #fdf6e3; }
.t-afternoon #ecm-banner.b-active .b-label,
.t-afternoon #ecm-banner.b-active .b-text,
.t-afternoon #ecm-banner.b-active .b-sub { color: #eef3f8; }
.t-evening #ecm-banner.b-active .b-label,
.t-evening #ecm-banner.b-active .b-text,
.t-evening #ecm-banner.b-active .b-sub   { color: #f5c8a0; }
.t-night #ecm-banner.b-active .b-label,
.t-night #ecm-banner.b-active .b-text,
.t-night #ecm-banner.b-active .b-sub     { color: #141820; }
#ecm-banner.b-quiet { background: transparent; border: 2px solid; }
.t-morning #ecm-banner.b-quiet   { border-color: #dfc98a; }
.t-afternoon #ecm-banner.b-quiet { border-color: #a8c4de; }
.t-evening #ecm-banner.b-quiet   { border-color: rgba(0,0,0,0.2); }
.t-night #ecm-banner.b-quiet     { border-color: #2e3a50; }
#ecm-banner.b-consult { background: transparent; border: 2.5px dashed; }
.t-morning #ecm-banner.b-consult   { border-color: #c4700a; }
.t-afternoon #ecm-banner.b-consult { border-color: #1a5fa8; }
.t-evening #ecm-banner.b-consult   { border-color: rgba(0,0,0,0.4); }
.t-night #ecm-banner.b-consult     { border-color: #7aaae0; }
#ecm-banner .b-emoji { font-size: 28px; flex-shrink: 0; }
#ecm-banner .b-content { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
#ecm-banner .b-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; opacity: 0.7; }
#ecm-banner .b-text  { font-size: 26px; font-weight: 900; font-family: 'Playfair Display', Georgia, serif; line-height: 1.2; }
#ecm-banner .b-sub   { font-size: 14px; margin-top: 4px; opacity: 0.75; }

/* ── SECTION HEADER ── */
.section-header {
  font-size: 17px; font-weight: 700; margin-bottom: 14px;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
}
#sync-indicator { font-size: 12px; font-weight: 500; opacity: 0.6; }
.sync-ok  { color: #4a8a50 !important; opacity: 1 !important; }
.sync-err { color: #c03020 !important; opacity: 1 !important; }

/* ── EVENT LIST ── */
#reminders-list { margin-bottom: 32px; }
.reminder {
  border-radius: 14px; padding: 16px 18px; margin-bottom: 10px;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  gap: 16px; border: 2px solid;
}
.t-morning .reminder   { background: #f5ebc8; border-color: #e8d090; }
.t-afternoon .reminder { background: #dde8f2; border-color: #b8d0e8; }
.t-evening .reminder   { background: rgba(255,255,255,0.25); border-color: rgba(0,0,0,0.12); }
.t-night .reminder     { background: #1e2430; border-color: #2e3a50; }
.reminder.past { opacity: 0.45; }
.reminder.past .r-text { text-decoration: line-through; }
.reminder.r-current { border-left-width: 6px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.t-morning .reminder.r-current   { background: #fff3e0; border-color: #c4700a; }
.t-afternoon .reminder.r-current { background: #dbeeff; border-color: #1a5fa8; }
.t-evening .reminder.r-current   { background: rgba(255,255,255,0.42); border-color: #1a0800; }
.t-night .reminder.r-current     { background: #1e2d40; border-color: #7aaae0; }
.reminder.r-current .r-time  { opacity: 1; font-size: 38px; }
.reminder.r-current .r-text  { font-size: 26px; }
.t-morning .reminder.r-current .r-time,  .t-morning .reminder.r-current .r-status   { color: #c4700a; }
.t-afternoon .reminder.r-current .r-time,.t-afternoon .reminder.r-current .r-status { color: #1a5fa8; }
.t-evening .reminder.r-current .r-time,  .t-evening .reminder.r-current .r-status   { color: #1a0800; }
.t-night .reminder.r-current .r-time,    .t-night .reminder.r-current .r-status     { color: #7aaae0; }
.reminder.r-gcal { border-left-width: 6px; border-left-color: #4a8ad4 !important; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.reminder.r-gcal .r-time { color: #4a8ad4; opacity: 1; }
.reminder.r-birthday { opacity: 0.75; border-style: dashed; }
.t-morning .reminder.r-birthday   { background: rgba(245,235,200,0.5); border-color: #e8d090; }
.t-afternoon .reminder.r-birthday { background: rgba(221,232,242,0.5); border-color: #b8d0e8; }
.t-evening .reminder.r-birthday   { background: rgba(255,255,255,0.15); border-color: rgba(0,0,0,0.1); }
.t-night .reminder.r-birthday     { background: rgba(30,36,48,0.5); border-color: #2e3a50; }
.r-time { font-family: 'Playfair Display', Georgia, serif; font-size: 30px; font-weight: 700; min-width: 82px; opacity: 0.5; flex-shrink: 0; }
.reminder.r-birthday .r-time { font-size: 24px; }
.r-body { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
.r-text   { font-size: 21px; font-weight: 600; line-height: 1.3; }
.r-status { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; opacity: 0.6; }
.reminder.r-current .r-status { opacity: 1; }
.reminder.r-birthday .r-text  { font-size: 18px; font-weight: 500; }
.r-source   { font-size: 11px;
